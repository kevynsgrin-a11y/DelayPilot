<!--
  Decorative operations-desk grid. Owner: visual-asset-director.

  Permitted as an ambient decorative surface on the public marketing routes only, under ADR 0003
  rule 2b: original SVG art, aria-hidden, no text, no data. It carries no motion at all — a grid
  that moves while someone reads is exactly the failure that rule guards against.

  (CSS custom properties are named in this comment without their leading double hyphen, because an
  XML comment may not contain one.)

  HOOKS   #grid-tile   a 24-unit `patternUnits="userSpaceOnUse"` pattern. Fill any rect with
                       `fill="url(#grid-tile)"` at any size; it is seamless because each tile
                       draws only its top and left edges, so adjacent tiles never double a line.
          #grid-major  the 120-unit emphasis lines, a separate group so they can be dropped.
  COLOUR  `motif-line` custom property, falling back to currentColor.

  Contrast note: this is decorative and aria-hidden, so no contrast minimum applies to it — but it
  must never sit behind body text in a way that changes a pair measured without it (ADR 0003
  rule 2b). Put it behind empty surface, not behind prose.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 240 240"
  width="240"
  height="240"
  fill="none"
  stroke="var(--motif-line, currentColor)"
  aria-hidden="true"
  focusable="false"
>
  <defs>
    <pattern id="grid-tile" width="24" height="24" patternUnits="userSpaceOnUse">
      <path
        d="M24 0H0V24"
        fill="none"
        stroke="var(--motif-line, currentColor)"
        stroke-width="1"
        stroke-opacity="var(--motif-grid-opacity, 0.14)"
      />
    </pattern>
  </defs>
  <rect width="240" height="240" fill="url(#grid-tile)" stroke="none" />
  <g id="grid-major" stroke-width="1" stroke-opacity="var(--motif-grid-major-opacity, 0.26)">
    <path d="M0 120H240M120 0V240" />
  </g>
</svg>
